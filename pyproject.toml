[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stuck-in-the-loop"
version = "0.1.0"
description = "Detects validation loops, premature convergence, and drift in human-AI conversation transcripts by modeling the session as a trajectory through a state space."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
eval = ["pyarrow>=15"]

[tool.setuptools]
packages = ["sil"]
