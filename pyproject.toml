[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stuck-in-the-loop"
version = "0.1.0"
description = "Finds where a human-AI conversation goes wrong after the user pushes back (caving, circling)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
eval = ["pyarrow>=15"]

[tool.setuptools]
packages = ["sil"]

[tool.setuptools.package-data]
sil = ["weights.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
